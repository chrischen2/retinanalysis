[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retinanalysis"
version = "0.1"
description = 'An analysis pipeline package for MEA data, created for the Rieke/Manookin lab'
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = []
authors = [
  { name = "DRezeanu", email = "DRezeanu@uw.edu" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "hdf5storage",
  "h5py",
  "statsmodels",
  "progressbar2",
  "Cython",
  "setuptools",
  "opencv-python",
  "matplotlib",
  "scikit-learn",
  "pybind11",
  "scipy==1.15",
  "numpy==2.2.6",
  "pandas",
  "seaborn",
  "datajoint==0.14.4",
  "ipywidgets",
  "ipympl",
  "matplotlib_venn",
  "torch",
  "torchaudio",
  "torchvision",
  # VS Code Jupyter 2025.9.1 can hang indefinitely during the ipykernel 7
  # IOPub startup handshake (microsoft/vscode-jupyter#17481).
  "ipykernel>=6.29,<7",
  "xarray",
  "dask",
  "netCDF4",
  "bottleneck"]

[project.urls]
Documentation = "https://github.com/DRezeanu/retinanalysis#readme"
Issues = "https://github.com/DRezeanu/retinanalysis/issues"
Source = "https://github.com/DRezeanu/retinanalysis"

[tool.pytest.ini_options]
# `slow` is the debug-loop switch. Fitting the LNK takes tens of seconds a
# call, and five tests that each fit one are 95% of the suite's runtime, so
# `pytest -m "not slow"` is what to run while editing and the unmarked run is
# what to run before committing.
markers = [
  "slow: fits a model; tens of seconds. Skip with -m 'not slow'.",
  "real_data: needs a cached recording under SingCell_Notebooks/rodAdaptation/fixtures/.",
]
